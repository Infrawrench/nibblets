name: Release

# A release is a version in package.json that hasn't been tagged yet: bump it
# (`pnpm release 0.2.0`), push to main, and this builds and publishes it. The
# Docker images go to GHCR first, since the app pulls its own version's; then
# the signed, notarised Mac app goes on a GitHub release tagged v<version>,
# with the server's OpenAPI description.
# Nothing runs until the repository variable RELEASES_ENABLED is "true".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/infrawrench/nibblets-

jobs:
  check:
    name: Is this a new version?
    # Off until the repository variable RELEASES_ENABLED is "true".
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        run: |
          version=$(jq -r .version package.json)
          desktop=$(jq -r .version apps/desktop/package.json)
          if [ "$version" != "$desktop" ]; then
            echo "::error::package.json says $version but the desktop app says $desktop; run pnpm release"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released."
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version."
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

  images:
    name: Image ${{ matrix.image }} (${{ matrix.arch }})
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [server, runner, credproxy]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          tag="${IMAGE_PREFIX}${{ matrix.image }}:${VERSION}-${{ matrix.arch }}"
          docker build -f docker/${{ matrix.image }}.Dockerfile -t "$tag" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.licenses=GPL-2.0-only .
          docker push "$tag"

  manifests:
    name: Image manifests
    needs: [check, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One tag for both architectures
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for image in server runner credproxy; do
            base="${IMAGE_PREFIX}${image}"
            docker buildx imagetools create -t "$base:$VERSION" -t "$base:latest" \
              "$base:$VERSION-amd64" "$base:$VERSION-arm64"
          done

  desktop:
    name: Desktop app (${{ matrix.os }} ${{ matrix.arch }})
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: mac, arch: arm64, runner: macos-15 }
          - { os: mac, arch: x64, runner: macos-15-intel }
          - { os: linux, arch: x64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: win, arch: x64, runner: windows-2025 }
          - { os: win, arch: arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Only what the app needs: Connect's workerd has no Windows Arm build.
      - run: pnpm install --frozen-lockfile --filter "@nibblets/desktop..."
      - name: Build, sign and notarise (Mac)
        if: matrix.os == 'mac'
        # build/notarize.cjs retries stapling itself; this is for anything else
        # flaky (a notarisation service hiccup, say).
        run: |
          for attempt in 1 2; do
            pnpm --filter @nibblets/desktop dist:mac && exit 0
            echo "::warning::Mac build attempt $attempt failed"
            sleep 30
          done
          exit 1
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Check it's signed and notarised (Mac)
        if: matrix.os == 'mac'
        run: |
          app=$(ls -d apps/desktop/dist/mac*/Nibblets.app | head -n1)
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute -vv "$app"
      - name: Keep this architecture's update feed apart (Mac)
        # Both Mac builds write latest-mac.yml; publishing merges them.
        if: matrix.os == 'mac'
        run: mv apps/desktop/dist/latest-mac.yml apps/desktop/dist/latest-mac-${{ matrix.arch }}.yml
      - name: Build (Linux)
        if: matrix.os == 'linux'
        run: pnpm --filter @nibblets/desktop dist:linux
      - name: Name the x64 files like the rest (Linux)
        # electron-builder names them amd64 (deb) and x86_64 (AppImage).
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        working-directory: apps/desktop/dist
        run: |
          mv Nibblets-amd64.deb Nibblets-x64.deb
          mv Nibblets-x86_64.AppImage Nibblets-x64.AppImage
      - name: Build (Windows)
        if: matrix.os == 'win'
        run: pnpm --filter @nibblets/desktop dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            apps/desktop/dist/Nibblets-*.dmg
            apps/desktop/dist/Nibblets-*.zip
            apps/desktop/dist/latest-mac-*.yml
            apps/desktop/dist/Nibblets-*.AppImage
            apps/desktop/dist/Nibblets-*.deb
            apps/desktop/dist/Nibblets-setup-*.exe
          if-no-files-found: error

  openapi:
    name: OpenAPI description
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@nibblets/server..."
      - name: What a server serves at /api/openapi.json
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          node apps/server/src/cli.ts openapi > openapi.json
          jq -e --arg version "$VERSION" '.info.version == $version' openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
          if-no-files-found: error

  publish:
    name: Publish v${{ needs.check.outputs.version }}
    needs: [check, manifests, desktop, openapi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Only for a script; pnpm isn't set up in this job.
          package-manager-cache: false
      - name: Merge the Mac update feeds
        run: |
          node apps/desktop/src/feed.ts dist/latest-mac-*.yml > dist/latest-mac.yml
          rm dist/latest-mac-*.yml
          cat dist/latest-mac.yml
      - name: Release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "## What's new"
            echo
            git log --no-merges --pretty='- %s' ${previous:+$previous..}HEAD | grep -v '^- Release ' || true
            echo
            echo "## Install"
            echo
            echo "- **Mac:** Nibblets-arm64.dmg (Apple Silicon) or Nibblets-x64.dmg (Intel)"
            echo "- **Windows:** Nibblets-setup-x64.exe (or arm64)"
            echo "- **Linux desktop:** the AppImage or .deb for your machine"
            echo '- **Linux server or VM:** `curl -fsSL https://nibblets.dev/install.sh | bash`'
            echo
            echo "openapi.json describes this version's server API (OpenAPI 3.1), as a server serves it at /api/openapi.json."
            echo
            echo "Or get it from https://nibblets.dev"
          } > notes.md
          cat notes.md
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Nibblets $VERSION" \
            --notes-file notes.md
