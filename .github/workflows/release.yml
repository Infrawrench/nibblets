name: Release

# A release is a version in package.json that hasn't been tagged yet: bump it
# (`pnpm release 0.2.0`), push to main, and this builds and publishes it. The
# Docker images go to GHCR first, since the app pulls its own version's; then
# the signed, notarised Mac app goes on a GitHub release tagged v<version>.
# Nothing runs until the repository variable RELEASES_ENABLED is "true".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/infrawrench/nibblets-

jobs:
  check:
    name: Is this a new version?
    # Off until the repository variable RELEASES_ENABLED is "true".
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        run: |
          version=$(jq -r .version package.json)
          desktop=$(jq -r .version apps/desktop/package.json)
          if [ "$version" != "$desktop" ]; then
            echo "::error::package.json says $version but the desktop app says $desktop; run pnpm release"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released."
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version."
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

  images:
    name: Image ${{ matrix.image }} (${{ matrix.arch }})
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [server, runner, credproxy]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          tag="${IMAGE_PREFIX}${{ matrix.image }}:${VERSION}-${{ matrix.arch }}"
          docker build -f docker/${{ matrix.image }}.Dockerfile -t "$tag" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.licenses=GPL-2.0-only .
          docker push "$tag"

  manifests:
    name: Image manifests
    needs: [check, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One tag for both architectures
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for image in server runner credproxy; do
            base="${IMAGE_PREFIX}${image}"
            docker buildx imagetools create -t "$base:$VERSION" -t "$base:latest" \
              "$base:$VERSION-amd64" "$base:$VERSION-arm64"
          done

  mac:
    name: Mac app (${{ matrix.arch }})
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build, sign and notarise
        run: pnpm --filter @nibblet/desktop dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Check it's signed and notarised
        run: |
          app=$(ls -d apps/desktop/dist/mac*/Nibblets.app | head -n1)
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute -vv "$app"
          xcrun stapler validate "apps/desktop/dist/Nibblets-${{ matrix.arch }}.dmg" || true
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: apps/desktop/dist/Nibblets-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    name: Publish v${{ needs.check.outputs.version }}
    needs: [check, manifests, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "## What's new"
            echo
            git log --no-merges --pretty='- %s' ${previous:+$previous..}HEAD | grep -v '^- Release ' || true
            echo
            echo "## Install"
            echo
            echo "- **Mac:** download Nibblets-arm64.dmg (Apple Silicon) or Nibblets-x64.dmg (Intel), or get it from https://nibblets.dev"
            echo '- **Linux:** `curl -fsSL https://nibblets.dev/install.sh | bash`'
          } > notes.md
          cat notes.md
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.dmg \
            --target "$GITHUB_SHA" \
            --title "Nibblets $VERSION" \
            --notes-file notes.md
