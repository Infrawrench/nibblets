name: Machines

# The slow integration runs, whose guests are installed from scratch:
# Windows on KVM here, for changes to machines, weekly, or by hand.
# Hyper-V and Apple Virtualization aren't on hosted runners;
# test/integration/README.md says how to run those.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  pull_request:
    paths:
      - "packages/machine/**"
      - "packages/machine-kvm/**"
      - "packages/protocol/src/guest.ts"
      - "apps/runner/src/entry/**"
      - "apps/runner/src/machine/**"
      - "test/integration/**"
      - ".github/workflows/machines.yml"

concurrency:
  group: machines-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  windows-kvm:
    name: Integration (Windows on KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # Where to download a Windows installer ISO (x64) from, as a secret.
      WINDOWS_ISO_URL: ${{ secrets.WINDOWS_ISO_URL }}
    steps:
      - name: Say what's missing
        if: env.WINDOWS_ISO_URL == ''
        run: echo "::warning::Set the WINDOWS_ISO_URL secret to test Windows guests."
      - uses: actions/checkout@v5
        if: env.WINDOWS_ISO_URL != ''
      - name: Make room
        # The ISO, Windows' disk, and the images.
        if: env.WINDOWS_ISO_URL != ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build the runner and the server
        if: env.WINDOWS_ISO_URL != ''
        run: |
          docker build -f docker/runner.Dockerfile -t nibblet/runner:dev .
          docker build -f docker/server.Dockerfile -t nibblet/server:dev .
      - uses: pnpm/action-setup@v4
        if: env.WINDOWS_ISO_URL != ''
      - uses: actions/setup-node@v5
        if: env.WINDOWS_ISO_URL != ''
        with:
          node-version: 24
          cache: pnpm
      - if: env.WINDOWS_ISO_URL != ''
        run: pnpm install --frozen-lockfile
      - name: Use KVM
        if: env.WINDOWS_ISO_URL != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
      - name: Download Windows
        if: env.WINDOWS_ISO_URL != ''
        run: curl -fsSL --retry 5 -o "$RUNNER_TEMP/windows.iso" "$WINDOWS_ISO_URL"
      - if: env.WINDOWS_ISO_URL != ''
        run: pnpm test:integration
        env:
          NIBBLET_TEST_MACHINE: kvm
          NIBBLET_TEST_GUEST: windows
          NIBBLET_TEST_WINDOWS_ISO: ${{ runner.temp }}/windows.iso
          # A PR's run is of its merge commit, which isn't on GitHub to download.
          NIBBLET_TEST_GUEST_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          NIBBLET_TEST_MACHINES_DIR: ${{ runner.temp }}/machines
          NIBBLET_TEST_VERBOSE: "1"
      - name: Keep the installer's screen and logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: windows-kvm
          path: |
            ${{ runner.temp }}/machines/**/*.png
            ${{ runner.temp }}/machines/**/*.log
          if-no-files-found: ignore
