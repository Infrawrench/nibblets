name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The desktop app's Electron binary isn't needed to typecheck or test it.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-24.04
    services:
      # For the tests that need a real database (snapshots).
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: nibblet
          POSTGRES_PASSWORD: nibblet
          POSTGRES_DB: nibblet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nibblet -d nibblet"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        # Also generates its route tree, which typechecking needs.
        run: pnpm --filter @nibblets/web build
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: Shellcheck
        run: shellcheck install.sh docker/up.sh docker/chromium.sh
      - run: pnpm test
        env:
          NIBBLET_TEST_DATABASE_URL: postgres://nibblet:nibblet@localhost:5432/nibblet

  windows-helpers:
    name: Windows guest helpers
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - run: ./test/windows/helpers.ps1
        shell: pwsh

  images:
    name: Docker images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the runner, server and credential proxy
        run: |
          docker build -f docker/runner.Dockerfile -t nibblet/runner:dev .
          docker build -f docker/server.Dockerfile -t nibblet/server:dev .
          docker build -f docker/credproxy.Dockerfile -t nibblet/credproxy:dev .
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test against the runner image
        run: pnpm vitest run packages/machine-docker/test/home.test.ts
        env:
          NIBBLET_TEST_DOCKER: "1"

  integration:
    name: Integration (${{ matrix.machine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Apple's and Hyper-V's hypervisors aren't on hosted runners: see
        # test/integration/README.md for running those.
        machine: [docker, podman, kvm]
    steps:
      - uses: actions/checkout@v5
      - name: Make room
        # A VM's Linux image is made from the runner image, and needs about 12 GB.
        if: matrix.machine == 'kvm'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/julia* /opt/microsoft /opt/google /usr/lib/google-cloud-sdk /opt/az /usr/share/miniconda
          docker image prune -af
          df -h /
      - name: Build the runner and the server
        run: |
          docker build -f docker/runner.Dockerfile -t nibblet/runner:dev .
          docker build -f docker/server.Dockerfile -t nibblet/server:dev .
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use Podman
        if: matrix.machine == 'podman'
        # Rootful, as the server needs to make containers; the images move over.
        run: |
          sudo mkdir -p /etc/systemd/system/podman.socket.d
          printf '[Socket]\nSocketMode=0666\n' | sudo tee /etc/systemd/system/podman.socket.d/open.conf
          sudo systemctl daemon-reload
          sudo systemctl restart podman.socket
          sudo chmod 755 /run/podman
          DOCKER_HOST=unix:///run/podman/podman.sock docker version
          docker save nibblet/runner:dev nibblet/server:dev | sudo podman load
          echo "DOCKER_HOST=unix:///run/podman/podman.sock" >> "$GITHUB_ENV"
          echo "NIBBLET_TEST_DOCKER_SOCKET=/run/podman/podman.sock" >> "$GITHUB_ENV"
      - name: Use KVM
        if: matrix.machine == 'kvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
      - run: pnpm test:integration
        env:
          NIBBLET_TEST_MACHINE: ${{ matrix.machine == 'podman' && 'docker' || matrix.machine }}
          NIBBLET_TEST_VERBOSE: "1"
