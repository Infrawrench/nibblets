appId: com.infrawrench.nibblets
# The name is package.json's productName, which the app reads at runtime too.
icon: assets/icon.png
directories:
  output: dist
files:
  - out/**
  - package.json
# node-pty's binaries can't load from inside the asar archive.
asarUnpack:
  - out/node_modules/node-pty/**
extraResources:
  - from: ../../docker/compose.yaml
    to: docker/compose.yaml
# Where the app looks for updates (electron-updater): github.com's release
# files, not its API. CI builds with --publish never and uploads them itself.
publish:
  provider: github
  owner: Infrawrench
  repo: nibblets
# nibblets:// links bring a sign-in made in the browser back to the app.
protocols:
  - name: Nibblets
    schemes:
      - nibblets
afterSign: build/notarize.cjs
mac:
  category: public.app-category.developer-tools
  # The dmg to install from, and the zip (with latest-mac.yml) that updates install.
  target:
    - dmg
    - zip
  # One per architecture, built natively: Nibblets-arm64.dmg and Nibblets-x64.dmg.
  artifactName: ${productName}-${arch}.${ext}
  # Signed with the Developer ID in CSC_LINK, and notarised by
  # build/notarize.cjs when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
  # APPLE_TEAM_ID are set (in CI), which also staples the ticket when Apple lets it.
  notarize: false
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Apple's VM helper, for nibblets in virtual machines: signed like the
  # app, with the virtualization entitlement it needs (entitlements.mac.plist).
  extraResources:
    - from: out/nibblet-vm
      to: nibblet-vm
  binaries:
    - Contents/Resources/nibblet-vm
  extendInfo:
    LSUIElement: false
    # What macOS shows when the UI asks for the location, to share with a nibblet.
    NSLocationUsageDescription: Nibblets shares where you are with a nibblet when you ask it to.
    NSLocationWhenInUseUsageDescription: Nibblets shares where you are with a nibblet when you ask it to.
win:
  target: nsis
  # Nibblets-setup-x64.exe and Nibblets-setup-arm64.exe. Not code-signed yet,
  # so Windows' SmartScreen asks before running it.
  artifactName: ${productName}-setup-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Development
  # Otherwise the package's name, which has a slash in it.
  executableName: nibblets
  # Nibblets-x64.AppImage, Nibblets-x64.deb, and the arm64 ones.
  artifactName: ${productName}-${arch}.${ext}
  maintainer: Infrawrench <astrid@infrawrench.com>
deb:
  # Docker is what it needs; it's set up from the app's own walkthrough.
  depends: []
