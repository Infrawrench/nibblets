appId: com.infrawrench.nibblets
productName: Nibblets
icon: assets/icon.png
directories:
  output: dist
files:
  - out/**
  - package.json
# node-pty's binaries can't load from inside the asar archive.
asarUnpack:
  - out/node_modules/node-pty/**
extraResources:
  - from: ../../docker/compose.yaml
    to: docker/compose.yaml
mac:
  category: public.app-category.developer-tools
  target: dmg
  # One per architecture, built natively: Nibblets-arm64.dmg and Nibblets-x64.dmg.
  artifactName: ${productName}-${arch}.${ext}
  # Signed with the Developer ID in CSC_LINK, and notarised when APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set (in CI).
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: false
win:
  target: nsis
  # Nibblets-setup-x64.exe and Nibblets-setup-arm64.exe. Not code-signed yet,
  # so Windows' SmartScreen asks before running it.
  artifactName: ${productName}-setup-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Development
  # Otherwise the package's name, which has a slash in it.
  executableName: nibblets
  # Nibblets-x64.AppImage, Nibblets-x64.deb, and the arm64 ones.
  artifactName: ${productName}-${arch}.${ext}
  maintainer: Infrawrench <astrid@infrawrench.com>
deb:
  # Docker is what it needs; it's set up from the app's own walkthrough.
  depends: []
